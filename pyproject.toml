[project]
name = "colombian-news-nlp-analysis"
version = "0.1.0"
description = "Proyecto de scraping y NLP para análisis de noticias colombianas (scraping, features, modelado y API)."
authors = [
    { name = "Pablo Reyes" },
    { name = "Juliana Castano" },
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "joblib>=1.4,<2.0",
    "pyarrow>=17.0,<22.0",
    "openpyxl>=3.1,<4.0",
    "requests>=2.32,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.3,<6.0",
    "selenium>=4.24,<5.0",
    "webdriver-manager>=4.0,<5.0",
    "scipy>=1.13,<2.0",
    "scikit-learn>=1.5,<2.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "spacy>=3.7,<4.0",
    "unidecode>=1.3,<2.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<0.1.0",
    "torch>=2.4,<3.0",
    "transformers>=4.44,<5.0",
    "tqdm>=4.66,<5.0",
    "streamlit>=1.49,<2.0",
]

[project.optional-dependencies]
notebooks = [
    "plotly>=5.0,<6.0",
    "ipywidgets>=8.0,<9.0",
]
dev = [
    "pytest>=8.4,<9.0",
]

[project.scripts]
colnews-api = "scripts.api.serve:main"
colnews-features = "scripts.pipeline.feature_extraction:main"
colnews-modeling = "scripts.pipeline.modeling:main"

[tool.poetry]
packages = [
    { include = "src" },
    { include = "scripts" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
